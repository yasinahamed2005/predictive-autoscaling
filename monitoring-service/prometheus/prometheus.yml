# Prometheus scrape configuration for the Predictive Autoscaling platform.
# Two scrape targets:
#   - the Dukaan backend, which exposes /metrics via prom-client
#   - the autoscaler + ml-service, for observability of the control loop itself
global:
  scrape_interval: 5s       # frequent enough to catch flash-sale style spikes
  evaluation_interval: 5s

scrape_configs:
  - job_name: "dukaan-backend"
    metrics_path: /metrics
    static_configs:
      # docker-compose target
      - targets: ["backend:5000"]
        labels:
          service: "backend"

  - job_name: "dukaan-backend-k8s"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["predictive-autoscaling"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: backend
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "${1}:5000"

  - job_name: "ml-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]
        labels:
          service: "ml-service"

  - job_name: "autoscaler"
    metrics_path: /metrics
    static_configs:
      - targets: ["autoscaler:9100"]
        labels:
          service: "autoscaler"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
