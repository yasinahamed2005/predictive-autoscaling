apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: predictive-autoscaling
spec:
  replicas: 1
  selector: { matchLabels: { app: ml-service } }
  template:
    metadata: { labels: { app: ml-service } }
    spec:
      containers:
        - name: ml-service
          image: predictive-autoscaling-ml-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: predictive-autoscaling
spec:
  selector: { app: ml-service }
  ports: [{ port: 8000, targetPort: 8000 }]
