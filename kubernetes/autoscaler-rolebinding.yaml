apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler-rolebinding
  namespace: predictive-autoscaling
subjects:
  - kind: ServiceAccount
    name: autoscaler
    namespace: predictive-autoscaling
roleRef:
  kind: Role
  name: autoscaler-role
  apiGroup: rbac.authorization.k8s.io
